name: printing_example
description: Pdf Printing Example

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  pdf_ce:
  printing_ce:
  vector_math: ^2.1.0
  xml: ">=7.0.1 <8.0.0"

dependency_overrides:
  pdf_ce:
    path: ../../pdf
  pdf_widget_wrapper_ce:
    path: ../../widget_wrapper
  printing_ce:
    path: ../

dev_dependencies:
  flutter_lints:

flutter:
  uses-material-design: true
