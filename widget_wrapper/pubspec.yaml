name: pdf_widget_wrapper_ce
description: >
  Plugin that allows embedding of Flutter Widgets into a PDF document.
homepage: https://github.com/kechankrisna/dart_pdf/tree/master/widget_wrapper
repository: https://github.com/kechankrisna/dart_pdf
issue_tracker: https://github.com/kechankrisna/dart_pdf/issues
version: 1.1.0

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.20.0-7.0.pre.48"

dependencies:
  flutter:
    sdk: flutter
  pdf_ce: ^3.13.0

dependency_overrides:
  pdf_ce:
    path: ../pdf

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
